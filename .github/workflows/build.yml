name: Build and Release QRKSDock v0.3.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pypdf

      - name: Build Standalone Executable
        run: |
          pyinstaller --onefile --name QRKSDock gui/app.py

      - name: Package Distributable ZIP (macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist
          zip -r ../QRKSDock-${{ matrix.os }}-${{ github.ref_name }}.zip .

      - name: Package Distributable ZIP (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist\* -DestinationPath QRKSDock-${{ matrix.os }}-${{ github.ref_name }}.zip

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v1
        with:
          files: QRKSDock-${{ matrix.os }}-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
