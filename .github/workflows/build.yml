name: Build QRKSDock

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller==6.22.3 supabase

      - name: Fetch AutoDock Vina (checksum-verified)
        run: python scripts/fetch_vina.py

      - name: Run test suite
        env:
          QRKS_SLOW: "1"
        run: python -m pytest -q

      - name: Build the app via spec file
        run: pyinstaller packaging/qrksdock.spec --noconfirm

      - name: Self-test the built app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath "dist\QRKSDock\QRKSDock.exe" -ArgumentList "selftest","--out","selftest.json"
          Get-Content selftest.json
          if (-not (Get-Content selftest.json | ConvertFrom-Json).ok) { throw "Self-test failed" }

      - name: Self-test the built app (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/QRKSDock.app/Contents/MacOS/QRKSDock selftest --out selftest.json
          cat selftest.json
          python -c "import json,sys; sys.exit(0 if json.load(open('selftest.json'))['ok'] else 1)"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\QRKSDock -DestinationPath QRKSDock-windows-x64.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: hdiutil create -volname QRKSDock -srcfolder dist/QRKSDock.app -ov -format UDZO QRKSDock-macos-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: QRKSDock-${{ matrix.label }}
          path: |
            QRKSDock-windows-x64.zip
            QRKSDock-macos-arm64.dmg
            selftest.json
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/QRKSDock-windows-x64.zip
            artifacts/QRKSDock-macos-arm64.dmg
          generate_release_notes: true
