services:
  app:
    build: .
    env_file: .env
    environment:
      QRKS_TRUST_PROXY_HEADERS: "true"      # safe only because Caddy is the sole way in
    volumes:
      - ./data:/srv/data
    restart: unless-stopped
    mem_limit: 400m
    expose:
      - "8000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      QRKS_DOMAIN: ${QRKS_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  caddy_data:
  caddy_config:
